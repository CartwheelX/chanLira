name: QuRiFT smoke tests

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9"]

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package metadata only
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install -r requirements-channel-lira.txt
      - name: Check package metadata and syntax
        run: |
          python setup.py --name
          python setup.py --version
          python -m compileall -q qurift experiments setup.py
      - name: Run ChannelLiRA numerical tests
        run: python -W error::DeprecationWarning -m unittest test.test_channel_lira test.test_channel_lira_continuous test.test_channel_lira_transfer -v
